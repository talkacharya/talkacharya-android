name: customr
description: "TalkAcharya — customer app (astrology consultation marketplace)."
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  equatable: ^2.0.7

  # navigation
  go_router: ^16.1.0
  app_links: ^6.3.2

  # ui
  flutter_svg: ^2.0.0
  pinput: ^5.0.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  confetti: ^0.8.0
  cached_network_image: ^3.4.1   # promo-rail images
  video_player: ^2.11.1          # promo-rail inline video
  markdown: ^7.3.1               # article bodies (parsed, rendered on brand type)

  # payments / sharing / launching
  razorpay_flutter: ^1.4.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

  # l10n
  flutter_localizations:
    sdk: flutter
  intl: any

  # networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # realtime
  centrifuge: ^0.14.1

  # push notifications
  firebase_core: ^3.11.0
  firebase_messaging: ^15.2.1
  firebase_app_check: ^0.3.1
  firebase_crashlytics: ^4.3.10
  flutter_local_notifications: ^18.0.1

  # auth (phone + SMS OTP — Google is the sender, no DLT/Twilio)
  firebase_auth: ^5.5.0

  # device / platform
  package_info_plus: ^8.1.2
  connectivity_plus: ^6.1.1

  # shared kundali rendering layer (models + chart painter + chart views)
  astro_kundali:
    path: ../../packages/astro_kundali

  # shared consultation chat (engine + widgets + TTS/STT)
  talkacharya_chat:
    path: ../../packages/talkacharya_chat

  # shared 1:1 voice calls (self-hosted WebRTC engine + call screen)
  talkacharya_call:
    path: ../../packages/talkacharya_call

  # shared paid-predictions layer (models + labels + widgets)
  talkacharya_predictions:
    path: ../../packages/talkacharya_predictions

  # models / codegen
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # storage / di
  flutter_secure_storage: ^9.2.2
  get_it: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  freezed: ^3.1.0
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21
  # Android 8+ adaptive icon: logo on the warm brand canvas.
  adaptive_icon_background: "#FFF8F4"
  adaptive_icon_foreground: "assets/icons/logo.png"
  adaptive_icon_foreground_inset: 18
  remove_alpha_ios: true

# `dart run flutter_native_splash:create` — branded launch screen (incl. Android 12+
# SplashScreen API) so cold start shows the logo instead of a blank white window.
flutter_native_splash:
  color: "#FFF8F4"
  image: assets/icons/logo.png
  color_dark: "#17120E"
  image_dark: assets/icons/logo.png
  android_12:
    color: "#FFF8F4"
    image: assets/icons/logo.png
    icon_background_color: "#FFF8F4"
    color_dark: "#17120E"
    image_dark: assets/icons/logo.png
    icon_background_color_dark: "#17120E"
  fullscreen: false
  web: false

flutter:
  uses-material-design: true
  generate: true   # gen-l10n from lib/l10n/*.arb — see l10n.yaml

  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/svg/zodiac/
