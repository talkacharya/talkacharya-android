name: customr
description: "TalkAcharya — customer app (astrology consultation marketplace)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  equatable: ^2.0.7

  # navigation
  go_router: ^16.1.0

  # networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # models / codegen
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # storage / di
  flutter_secure_storage: ^9.2.2
  get_it: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  freezed: ^3.1.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
