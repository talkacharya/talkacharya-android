name: astro
description: "TalkAcharya — astrologer app (consultations, availability, earnings)."
publish_to: 'none'
version: 1.0.3+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # state
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  equatable: ^2.0.7

  # navigation
  go_router: ^16.1.0

  # networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # shared kundali rendering layer (models + chart painter + chart views)
  astro_kundali:
    path: ../../packages/astro_kundali

  # shared consultation chat (engine + widgets + TTS/STT/dictation)
  talkacharya_chat:
    path: ../../packages/talkacharya_chat

  talkacharya_predictions:
    path: ../../packages/talkacharya_predictions

  # models / codegen
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # storage / di
  flutter_secure_storage: ^9.2.2
  get_it: ^8.0.3

  # shell infra
  app_links: ^6.3.2
  centrifuge: ^0.17.0
  connectivity_plus: ^6.1.1
  package_info_plus: ^8.1.2
  intl: any

  # push
  firebase_core: ^3.11.0
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^18.0.1

  # auth (phone + SMS OTP — Google is the sender, no DLT/Twilio)
  firebase_auth: ^5.5.0
  firebase_app_check: ^0.3.1

  # shared 1:1 voice calls (self-hosted WebRTC engine + call screen)
  talkacharya_call:
    path: ../../packages/talkacharya_call
  talkacharya_sounds:
    path: ../../packages/talkacharya_sounds

  # shared live streaming (self-hosted LiveKit room + host cubit)
  talkacharya_live:
    path: ../../packages/talkacharya_live

  # ui
  google_fonts: ^6.2.1
  pinput: ^5.0.0
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.3
  build_runner: ^2.4.13
  freezed: ^3.1.0
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.jpeg"
  min_sdk_android: 21 # android min sdk min:16, we are using flutter.minSdkVersion

flutter:
  uses-material-design: true
  generate: true   # gen-l10n from lib/l10n/*.arb — see l10n.yaml
  assets:
    - assets/images/
    - assets/icon/
    - assets/svg/
