name: talkacharya_assistant
description: "Shared assistant-chat layer for the TalkAcharya customer and astrologer apps — a free, text-only chat outside consultations: the models, the room controller (history, send, realtime, catch-up) and its widgets. Networking, routing and DI stay in each app."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  intl: any
  path: ^1.9.0
  sqflite: ^2.4.1
  talkacharya_ui:
    path: ../talkacharya_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
